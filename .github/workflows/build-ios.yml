name: Build LegacyPadDisplay

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show project
        run: |
          xcodebuild \
            -project iOS/LegacyPadDisplay.xcodeproj \
            -list

      - name: Build unsigned
        run: |
          xcodebuild \
            -project iOS/LegacyPadDisplay.xcodeproj \
            -scheme LegacyPadDisplay \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/LegacyPadDisplay.app Payload/
          zip -r LegacyPadDisplay-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LegacyPadDisplay-unsigned
          path: LegacyPadDisplay-unsigned.ipa
